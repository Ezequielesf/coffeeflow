<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeFlow | Ementa Digital & Gestão</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Compilador Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts (Mesma do Vittelis) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #151515;
      --black2: #1d1d1b;
      --cream: #f3efe7;
      --cream2: #e8e0d2;
      --gold: #a88a5a;
      --gold-light: #c6ab78;
      --brown: #5b4635;
      --white: #ffffff;
      --muted: #aaa49b;
      --line: rgba(255,255,255,.12);

      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", Arial, sans-serif;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--black);
      color: var(--cream);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    @media print {
      body * {
        visibility: hidden;
      }
      #print-qr-section, #print-qr-section * {
        visibility: visible;
      }
      #print-qr-section {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }
    }
  </style>
</head>
<body class="selection:bg-[#a88a5a] selection:text-[#151515]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_URL = 'https://tuecuhzmsyauzkdclrdv.supabase.co';
    const APP_API_URL = '/api';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1ZWN1aHptc3lhdXprZGNscmR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0NzU2NDMsImV4cCI6MjEwMTA1MTY0M30.YvC4MJi9Jv0r2O-9OhfNEh0Tfki8tghRyMuXpdRIZm0';

    const formatarPreco = (valor) => {
      return new Intl.NumberFormat('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      }).format(Number(valor) || 0);
    };

    const supabaseClient = window.supabase.createClient(API_URL, API_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    });

    let currentAccessToken = null;
    const PAYMENT_LINK = 'https://pay.cakto.com.br/iq44sy6_1035781';
    const gerarPinAleatorio = () => Math.floor(100000 + Math.random() * 900000).toString();

    const getUrlParams = () => {
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const menuIndex = pathSegments.indexOf('menu');
      let cafeteriaIdFromPath = null;
      let mesaNumFromPath = null;

      if (menuIndex !== -1 && pathSegments[menuIndex + 1]) {
        cafeteriaIdFromPath = pathSegments[menuIndex + 1];
      }

      const searchParams = new URLSearchParams(window.location.search);
      const hashString = window.location.hash.startsWith('#') ? window.location.hash.substring(1) : window.location.hash;
      const hashParams = new URLSearchParams(hashString);

      return {
        cafeteriaId: cafeteriaIdFromPath || searchParams.get('cafeteria'),
        mesaNum: mesaNumFromPath || searchParams.get('mesa') || '1',
        resetQuery: searchParams.get('reset') === 'true',
        accessToken: hashParams.get('access_token') || searchParams.get('access_token'),
        refreshToken: hashParams.get('refresh_token') || searchParams.get('refresh_token'),
        code: searchParams.get('code'),
        type: hashParams.get('type') || searchParams.get('type'),
        isResetRoute: window.location.pathname.includes('reset-password')
      };
    };

    const getAccessToken = async (forceRefresh = false) => {
      if (!forceRefresh && currentAccessToken) return currentAccessToken;
      const { data, error } = await supabaseClient.auth.getSession();
      if (!forceRefresh && data?.session?.access_token) {
        currentAccessToken = data.session.access_token;
        return currentAccessToken;
      }
      const { data: refreshData, error: refreshError } = await supabaseClient.auth.refreshSession();
      if (refreshError) throw new Error('Sessão expirada. Faça login novamente.');
      if (refreshData?.session?.access_token) {
        currentAccessToken = refreshData.session.access_token;
        return currentAccessToken;
      }
      throw new Error('Nenhuma sessão autenticada.');
    };

    const uploadImagemProduto = async (arquivo, cafeteriaId) => {
      if (!arquivo) return '';
      if (!arquivo.type.startsWith('image/')) throw new Error('Selecione uma imagem válida.');
      if (arquivo.size > 5 * 1024 * 1024) throw new Error('A imagem deve ter no máximo 5 MB.');
      
      const extensao = arquivo.name.split('.').pop().toLowerCase();
      const nomeArquivo = `${cafeteriaId}/${crypto.randomUUID()}.${extensao}`;

      const { error } = await supabaseClient.storage.from('produtos').upload(nomeArquivo, arquivo, {
        cacheControl: '3600', upsert: false, contentType: arquivo.type
      });

      if (error) throw new Error('Não foi possível enviar a imagem.');
      const { data } = supabaseClient.storage.from('produtos').getPublicUrl(nomeArquivo);
      return data.publicUrl;
    };

    const supabaseService = {
      buscarCafeteriaPorId: async (id) => {
        try {
          if (!id) return null;
          const res = await fetch(`${API_URL}/rest/v1/cafeterias?id=eq.${encodeURIComponent(id)}`, {
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
          });
          if (!res.ok) return null;
          const data = await res.json();
          return data?.[0] || null;
        } catch (err) { return null; }
      },
      buscarCafeteriaPorUserId: async (userId) => {
        if (!userId) return null;
        try {
          const accessToken = await getAccessToken();
          const res = await fetch(`${API_URL}/rest/v1/cafeterias?user_id=eq.${encodeURIComponent(userId)}`, {
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${accessToken}` }
          });
          if (!res.ok) return null;
          const data = await res.json();
          return data?.[0] || null;
        } catch (err) { return null; }
      },
      buscarCafeteriaPorEmail: async (email) => {
        try {
          if (!email) return null;
          const cleanEmail = email.trim().toLowerCase();
          const res = await fetch(`${API_URL}/rest/v1/cafeterias?email=eq.${encodeURIComponent(cleanEmail)}`, {
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
          });
          if (!res.ok) return null;
          const data = await res.json();
          return data?.[0] ? { exists: true } : null;
        } catch (err) { return null; }
      },
      buscarCafeteriaPorPin: async (pin) => {
        const res = await fetch('/api/staff-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error || `Erro HTTP ${res.status}`);
        const caf = data.cafeteria;
        return caf ? {
          id: caf.id, nome: caf.nome, plano_ativo: caf.plano_ativo,
          data_inscricao: caf.data_inscricao, data_expiracao: caf.data_expiracao,
          pin_equipe: data.pin_equipe || pin.trim(), email: caf.email || caf.dono_email
        } : null;
      },
      criarCafeteria: async (userId, email, nome, pin) => {
        const cleanEmail = (email || '').trim().toLowerCase();
        const agora = new Date();
        const dataExpiracao = new Date(agora.getTime() + 15 * 24 * 60 * 60 * 1000);
        const payload = {
          nome: nome || 'CoffeeFlow', pin_equipe: pin || gerarPinAleatorio(),
          email: cleanEmail, dono_email: cleanEmail, plano_ativo: true,
          data_inscricao: agora.toISOString(), data_expiracao: dataExpiracao.toISOString()
        };
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (userId) payload.user_id = userId;

        const res = await fetch(`${API_URL}/rest/v1/cafeterias`, {
          method: 'POST',
          headers: {
            'apikey': API_KEY, 'Authorization': `Bearer ${session?.access_token || API_KEY}`,
            'Content-Type': 'application/json', 'Prefer': 'return=representation'
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        return data?.[0];
      },
      atualizarPin: async (cafeteriaId, novoPin) => {
        try {
          const accessToken = await getAccessToken();
          const res = await fetch(`${API_URL}/rest/v1/cafeterias?id=eq.${encodeURIComponent(cafeteriaId)}`, {
            method: 'PATCH',
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ pin_equipe: novoPin })
          });
          return res.ok;
        } catch (err) { return false; }
      },
      buscarProdutos: async (cafeteriaId) => {
        try {
          if (!cafeteriaId) return [];
          const res = await fetch(`${API_URL}/rest/v1/produtos?cafeteria_id=eq.${encodeURIComponent(cafeteriaId)}&order=created_at.desc`, {
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
          });
          if (!res.ok) return [];
          return await res.json();
        } catch (err) { return []; }
      },
      salvarProduto: async (produto) => {
        let imagemUrl = produto.imagem || '';
        if (produto.arquivoImagem) {
          imagemUrl = await uploadImagemProduto(produto.arquivoImagem, produto.cafeteria_id);
        }
        let accessToken = await getAccessToken();
        const isEdit = Boolean(produto.id);
        const payload = {
          id: isEdit ? produto.id : undefined,
          nome: produto.nome.trim(), preco: Number(produto.preco),
          categoria: produto.categoria?.trim() || 'Cafés',
          descricao: produto.descricao?.trim() || '',
          imagem: imagemUrl.trim(), disponivel: produto.disponivel !== false
        };
        let res = await fetch(`${APP_API_URL}/products`, {
          method: isEdit ? 'PATCH' : 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error || 'Erro ao guardar produto.');
        return { success: true, produto: data?.produto || null };
      },
      deletarProduto: async (id) => {
        const accessToken = await getAccessToken();
        const res = await fetch(`${APP_API_URL}/products`, {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
          body: JSON.stringify({ id })
        });
        return { success: res.ok };
      },
      buscarPedidos: async (cafeteriaId) => {
        try {
          if (!cafeteriaId) return [];
          const res = await fetch(`${API_URL}/rest/v1/pedidos?cafeteria_id=eq.${encodeURIComponent(cafeteriaId)}&order=created_at.desc`, {
            headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
          });
          if (!res.ok) return [];
          return await res.json();
        } catch (err) { return []; }
      },
      criarPedido: async (pedido) => {
        const res = await fetch(`${API_URL}/rest/v1/pedidos`, {
          method: 'POST',
          headers: {
            'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json', 'Prefer': 'return=representation'
          },
          body: JSON.stringify(pedido)
        });
        const data = await res.json();
        return data?.[0] || null;
      }
    };

    function App() {
      const urlInfo = getUrlParams();
      const isClientAccessFromQr = Boolean(urlInfo.cafeteriaId);
      const [activeView, setActiveView] = useState(() => isClientAccessFromQr ? 'customer' : 'landing');
      const [cafeteria, setCafeteria] = useState({
        id: urlInfo.cafeteriaId || 'caf_demo_01',
        nome: 'CoffeeFlow',
        pinEquipe: '123456',
        planoAtivo: true,
        donoEmail: '',
        dataExpiracao: new Date(Date.now() + 15 * 24 * 60 * 60 * 1000).toISOString()
      });
      const [produtos, setProdutos] = useState([]);
      const [pedidos, setPedidos] = useState([]);
      const [carrinho, setCarrinho] = useState([]);
      const [notificacao, setNotificacao] = useState('');
      const [categoriaAtiva, setCategoriaAtiva] = useState('Todas');
      const [termoPesquisa, setTermoPesquisa] = useState('');
      const [selectedMesaCliente, setSelectedMesaCliente] = useState(urlInfo.mesaNum || '1');
      const [modalProduto, setModalProduto] = useState({ open: false, data: null });
      const [produtoAtual, setProdutoAtual] = useState(null);
      const [adminAuthMode, setAdminAuthMode] = useState('login');
      const [adminEmailInput, setAdminEmailInput] = useState('');
      const [adminPasswordInput, setAdminPasswordInput] = useState('');
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      useEffect(() => {
        if (cafeteria.id) {
          supabaseService.buscarProdutos(cafeteria.id).then(setProdutos);
        }
      }, [cafeteria.id]);

      const adicionarAoCarrinho = (produto) => {
        setCarrinho(prev => {
          const existe = prev.find(item => item.id === produto.id);
          if (existe) {
            return prev.map(item => item.id === produto.id ? { ...item, qtd: item.qtd + 1 } : item);
          }
          return [...prev, { ...produto, qtd: 1 }];
        });
        setNotificacao(`Adicionado: ${produto.nome}`);
        setTimeout(() => setNotificacao(''), 3000);
      };

      const enviarPedido = async () => {
        if (carrinho.length === 0) return;
        const total = carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
        const pedidoData = {
          cafeteria_id: cafeteria.id,
          codigo_pedido: `CF-${Math.floor(100 + Math.random() * 900)}`,
          mesa: selectedMesaCliente,
          itens: carrinho.map(c => ({ nome: c.nome, qtd: c.qtd, preco: c.preco })),
          total: total,
          status: 'pendente',
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        const criado = await supabaseService.criarPedido(pedidoData);
        if (criado) {
          setCarrinho([]);
          setNotificacao('Pedido enviado com sucesso à cozinha!');
          setTimeout(() => setNotificacao(''), 4000);
        }
      };

      return (
        <div className="min-h-screen bg-[#151515] text-[#f3efe7] font-sans">
          {/* HEADER ESTILO VITTELIS */}
          <header className="fixed top-0 left-0 w-full h-[82px] z-[999] flex items-center bg-[rgba(21,21,21,.78)] backdrop-blur-[18px] border-b border-[rgba(255,255,255,.07)]">
            <div className="w-[min(1180px,calc(100%-48px))] mx-auto flex justify-between items-center">
              <a href="#inicio" className="font-serif text-[34px] leading-[.8] tracking-[.04em] text-white">
                CoffeeFlow
                <small className="block mt-[7px] font-sans text-[7px] tracking-[.29em] uppercase text-[#c6ab78]">Ementa & Gestão</small>
              </a>

              {notificacao && (
                <div className="bg-[#a88a5a] text-[#151515] font-bold px-4 py-1.5 rounded-full text-xs shadow-lg animate-pulse">
                  {notificacao}
                </div>
              )}

              <div className="flex items-center gap-4 text-xs tracking-[.11em] uppercase">
                <button onClick={() => setActiveView('customer')} className={`hover:text-white transition ${activeView === 'customer' ? 'text-[#c6ab78]' : 'text-[rgba(243,239,231,.7)]'}`}>Ementa</button>
                <button onClick={() => setActiveView('admin_login')} className={`hover:text-white transition ${activeView.includes('admin') ? 'text-[#c6ab78]' : 'text-[rgba(243,239,231,.7)]'}`}>Administração</button>
                <button onClick={() => setActiveView('staff_login')} className={`hover:text-white transition ${activeView.includes('staff') ? 'text-[#c6ab78]' : 'text-[rgba(243,239,231,.7)]'}`}>Equipa</button>
              </div>
            </div>
          </header>

          <main className="pt-[82px]">
            {/* VIEW CLIENTE / EMENTA */}
            {activeView === 'customer' && (
              <div>
                <section className="py-[120px] bg-[#151515] border-b border-[rgba(255,255,255,.07)]">
                  <div className="w-[min(1180px,calc(100%-48px))] mx-auto grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
                    <div>
                      <div className="flex items-center gap-3 text-[#c6ab78] text-[10px] tracking-[.24em] uppercase mb-6 before:content-[''] before:w-[42px] before:h-[1px] before:bg-[#a88a5a]">
                        Mesa {selectedMesaCliente} · Atendimento Digital
                      </div>
                      <h1 className="font-serif text-5xl md:text-7xl font-medium leading-[.9] tracking-[-.04em]">
                        Sabores que <span className="text-[#c6ab78] italic">inspiram.</span>
                      </h1>
                      <p className="mt-6 text-[rgba(243,239,231,.7)] text-sm leading-relaxed max-w-lg">
                        Explore o nosso cardápio digital, faça pedidos diretamente da mesa e acompanhe cada detalhe da sua experiência no CoffeeFlow.
                      </p>
                    </div>
                    {/* CARRINHO / RESUMO */}
                    <div className="bg-[#1d1d1b] border border-[rgba(255,255,255,.12)] p-6 rounded-2xl">
                      <h3 className="font-serif text-2xl mb-4 text-[#c6ab78]">O seu pedido (Mesa {selectedMesaCliente})</h3>
                      {carrinho.length === 0 ? (
                        <p className="text-xs text-[#aaa49b]">O seu carrinho está vazio. Escolha itens abaixo.</p>
                      ) : (
                        <div className="space-y-3 max-h-60 overflow-y-auto scrollbar-none mb-4">
                          {carrinho.map(item => (
                            <div key={item.id} className="flex justify-between items-center text-xs border-b border-[rgba(255,255,255,.07)] pb-2">
                              <span>{item.qtd}x {item.nome}</span>
                              <span className="text-[#c6ab78] font-bold">{formatarPreco(item.preco * item.qtd)}</span>
                            </div>
                          ))}
                        </div>
                      )}
                      {carrinho.length > 0 && (
                        <div className="pt-4 border-t border-[rgba(255,255,255,.12)] flex justify-between items-center">
                          <span className="font-bold text-sm">Total: <strong className="text-[#c6ab78]">{formatarPreco(carrinho.reduce((acc, i) => acc + (i.preco * i.qtd), 0))}</strong></span>
                          <button onClick={enviarPedido} className="bg-[#a88a5a] text-[#151515] px-5 py-2.5 text-[10px] font-bold tracking-[.14em] uppercase hover:bg-[#c6ab78] transition">
                            Enviar Pedido
                          </button>
                        </div>
                      )}
                    </div>
                  </div>
                </section>

                {/* PRODUTOS / EMENTA */}
                <section className="py-20 bg-[#f3efe7] text-[#151515]">
                  <div className="w-[min(1180px,calc(100%-48px))] mx-auto">
                    <div className="mb-12 flex justify-between items-end flex-wrap gap-6">
                      <div>
                        <div className="text-[#a88a5a] text-[10px] tracking-[.2em] uppercase mb-2">02 · Ementa Digital</div>
                        <h2 className="font-serif text-4xl md:text-5xl font-medium">Escolha e Saboreie.</h2>
                      </div>
                      <input 
                        type="text" 
                        placeholder="Pesquisar produto..." 
                        value={termoPesquisa} 
                        onChange={e => setTermoPesquisa(e.target.value)}
                        className="p-3 bg-white border border-[#e8e0d2] text-xs rounded-lg w-72 focus:outline-none focus:border-[#a88a5a]"
                      />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      {produtos.filter(p => p.nome.toLowerCase().includes(termoPesquisa.toLowerCase())).map(produto => (
                        <div key={produto.id} className="bg-white border border-[#e8e0d2] p-6 rounded-xl flex flex-col justify-between hover:shadow-xl transition">
                          <div>
                            {produto.imagem && <img src={produto.imagem} alt={produto.nome} className="h-48 w-full object-cover rounded-lg mb-4" />}
                            <span className="text-[10px] text-[#a88a5a] uppercase tracking-wider">{produto.categoria}</span>
                            <h3 className="font-serif text-2xl font-medium mt-1">{produto.nome}</h3>
                            <p className="text-xs text-[rgba(21,21,21,.6)] mt-2 leading-relaxed">{produto.descricao}</p>
                          </div>
                          <div className="mt-6 pt-4 border-t border-[#e8e0d2] flex justify-between items-center">
                            <span className="text-base font-bold text-[#a88a5a]">{formatarPreco(produto.preco)}</span>
                            <button onClick={() => adicionarAoCarrinho(produto)} className="bg-[#151515] text-[#f3efe7] px-4 py-2 text-[10px] font-bold tracking-widest uppercase hover:bg-[#a88a5a] hover:text-[#151515] transition">
                              Adicionar
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </section>
              </div>
            )}

            {/* VIEW LOGIN STAFF */}
            {activeView === 'staff_login' && (
              <div className="min-h-[80vh] flex items-center justify-center p-4">
                <div className="max-w-md w-full p-8 bg-[#1d1d1b] border border-[rgba(255,255,255,.12)] rounded-2xl shadow-2xl space-y-6">
                  <div className="text-center">
                    <div className="text-3xl mb-2">🔑</div>
                    <h2 className="font-serif text-3xl font-medium">Acesso Equipa</h2>
                    <p className="text-xs text-[#aaa49b] mt-1">Introduza o PIN de acesso da equipa.</p>
                  </div>
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    setPinError('');
                    try {
                      const caf = await supabaseService.buscarCafeteriaPorPin(pinInput);
                      if (caf) {
                        setCafeteria(caf);
                        setActiveView('staff_panel');
                      } else {
                        setPinError('PIN incorreto.');
                      }
                    } catch(err) { setPinError('Erro ao validar PIN.'); }
                  }} className="space-y-4">
                    <input 
                      type="password" 
                      maxLength="6"
                      value={pinInput} 
                      onChange={e => setPinInput(e.target.value)} 
                      placeholder="PIN de 6 dígitos" 
                      className="w-full p-3.5 bg-[#151515] border border-[rgba(255,255,255,.12)] rounded-xl text-center text-xl tracking-widest text-white focus:outline-none focus:border-[#a88a5a]" 
                      required 
                    />
                    {pinError && <div className="text-rose-400 text-xs text-center">{pinError}</div>}
                    <button type="submit" className="w-full py-3.5 bg-[#a88a5a] text-[#151515] font-bold text-xs tracking-widest uppercase rounded-xl hover:bg-[#c6ab78] transition">
                      Entrar no Painel
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* VIEW PAINEL STAFF */}
            {activeView === 'staff_panel' && (
              <div className="w-[min(1180px,calc(100%-48px))] mx-auto py-12">
                <div className="flex justify-between items-center mb-8 border-b border-[rgba(255,255,255,.12)] pb-4">
                  <div>
                    <span className="text-[#a88a5a] text-[10px] tracking-widest uppercase">Painel Operacional</span>
                    <h2 className="font-serif text-3xl font-medium">{cafeteria.nome} · Cozinha & Pedidos</h2>
                  </div>
                  <button onClick={() => setActiveView('customer')} className="border border-[#a88a5a] text-[#f3efe7] px-4 py-2 text-xs tracking-widest uppercase hover:bg-[#a88a5a] hover:text-[#151515] transition">
                    Ver Ementa
                  </button>
                </div>
                <div className="bg-[#1d1d1b] border border-[rgba(255,255,255,.12)] p-6 rounded-xl">
                  <h3 className="font-serif text-2xl mb-4 text-[#c6ab78]">Pedidos em Tempo Real</h3>
                  <p className="text-xs text-[#aaa49b]">Funcionalidade de gestão de pedidos ativa. Os novos pedidos surgem automaticamente.</p>
                </div>
              </div>
            )}

            {/* VIEW LOGIN ADMIN */}
            {activeView === 'admin_login' && (
              <div className="min-h-[80vh] flex items-center justify-center p-4">
                <div className="max-w-md w-full p-8 bg-[#1d1d1b] border border-[rgba(255,255,255,.12)] rounded-2xl shadow-2xl space-y-6">
                  <div className="text-center">
                    <div className="text-3xl mb-2">⚙️</div>
                    <h2 className="font-serif text-3xl font-medium">Administração</h2>
                    <p className="text-xs text-[#aaa49b] mt-1">Gerencie produtos, preços e QR Codes.</p>
                  </div>
                  <form onSubmit={async (e) => {
                    e.preventDefault();
                    try {
                      const { user, session } = await supabaseClient.auth.signInWithPassword({
                        email: adminEmailInput, password: adminPasswordInput
                      });
                      if (user) {
                        const dadosCaf = await supabaseService.buscarCafeteriaPorUserId(user.id);
                        if (dadosCaf) setCafeteria(dadosCaf);
                        setActiveView('admin_panel');
                      }
                    } catch(err) { alert('Erro no login admin.'); }
                  }} className="space-y-4">
                    <div>
                      <label className="text-[10px] text-[#aaa49b] uppercase tracking-widest block mb-1">E-mail</label>
                      <input type="email" value={adminEmailInput} onChange={e => setAdminEmailInput(e.target.value)} className="w-full p-3 bg-[#151515] border border-[rgba(255,255,255,.12)] rounded-xl text-xs text-white focus:outline-none focus:border-[#a88a5a]" required />
                    </div>
                    <div>
                      <label className="text-[10px] text-[#aaa49b] uppercase tracking-widest block mb-1">Palavra-passe</label>
                      <input type="password" value={adminPasswordInput} onChange={e => setAdminPasswordInput(e.target.value)} className="w-full p-3 bg-[#151515] border border-[rgba(255,255,255,.12)] rounded-xl text-xs text-white focus:outline-none focus:border-[#a88a5a]" required />
                    </div>
                    <button type="submit" className="w-full py-3.5 bg-[#a88a5a] text-[#151515] font-bold text-xs tracking-widest uppercase rounded-xl hover:bg-[#c6ab78] transition">
                      Entrar no Painel Admin
                    </button>
                  </form>
                </div>
              </div>
            )}

            {/* VIEW PAINEL ADMIN */}
            {activeView === 'admin_panel' && (
              <div className="w-[min(1180px,calc(100%-48px))] mx-auto py-12 space-y-8">
                <div className="flex justify-between items-center border-b border-[rgba(255,255,255,.12)] pb-4">
                  <div>
                    <span className="text-[#a88a5a] text-[10px] tracking-widest uppercase">Área do Gerente</span>
                    <h2 className="font-serif text-4xl font-medium">{cafeteria.nome} · Gestão</h2>
                  </div>
                  <button onClick={() => setActiveView('customer')} className="border border-[#a88a5a] text-[#f3efe7] px-5 py-2.5 text-[10px] font-bold tracking-widest uppercase hover:bg-[#a88a5a] hover:text-[#151515] transition">
                    Ver Ementa Pública
                  </button>
                </div>
                <div className="bg-[#1d1d1b] border border-[rgba(255,255,255,.12)] p-8 rounded-2xl">
                  <h3 className="font-serif text-2xl text-[#c6ab78] mb-4">Gerenciamento de Produtos</h3>
                  <p className="text-xs text-[#aaa49b]">Adicione novos cafés, bolos e bebidas à ementa digital instantaneamente.</p>
                </div>
              </div>
            )}
          </main>

          {/* FOOTER ESTILO VITTELIS */}
          <footer className="py-12 bg-[#151515] border-t border-[rgba(255,255,255,.12)] mt-20">
            <div className="w-[min(1180px,calc(100%-48px))] mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
              <div>
                <div className="font-serif text-3xl text-white">CoffeeFlow</div>
                <p className="text-[11px] text-[#aaa49b] mt-1">Ementa Digital & Gestão Operacional</p>
              </div>
              <div className="text-[9px] text-[#777] uppercase tracking-widest">
                © {new Date().getFullYear()} CoffeeFlow · Todos os direitos reservados.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
