const getAccessToken = async (forceRefresh = false) => {
if (!forceRefresh && currentAccessToken) {
return currentAccessToken;
}

const { data, error } = await supabaseClient.auth.getSession();

if (error) {
console.error('Erro ao recuperar sessão:', error);
}

if (!forceRefresh && data?.session?.access_token) {
currentAccessToken = data.session.access_token;
return currentAccessToken;
}

const { data: refreshData, error: refreshError } =
await supabaseClient.auth.refreshSession();

if (refreshError) {
console.error('Erro ao renovar sessão:', refreshError);
throw new Error(
'Sua sessão expirou. Faça login novamente na sua conta.'
);
}

if (refreshData?.session?.access_token) {
currentAccessToken = refreshData.session.access_token;
return currentAccessToken;
}

throw new Error(
'Nenhuma sessão autenticada foi encontrada. Faça login novamente.'
);
};

const uploadImagemProduto = async (arquivo, cafeteriaId) => {
if (!arquivo) return '';

if (!arquivo.type.startsWith('image/')) {
throw new Error('Selecione uma imagem válida.');
}

if (arquivo.size > 5 * 1024 * 1024) {
throw new Error('A imagem deve ter no máximo 5 MB.');
}

const extensao = arquivo.name.split('.').pop().toLowerCase();

const nomeArquivo =
``${cafeteriaId}/ {extensao}`;

const { error } = await supabaseClient.storage
.from('produtos')
.upload(nomeArquivo, arquivo, {
cacheControl: '3600',
upsert: false,
contentType: arquivo.type
});

if (error) {
console.error('Erro no upload:', error);
throw new Error('Não foi possível enviar a imagem.');
}

const { data } = supabaseClient.storage
.from('produtos')
.getPublicUrl(nomeArquivo);

return data.publicUrl;
};

const authService = {
login: async (email, password) => {
const cleanEmail = email.trim().toLowerCase();
if (!cleanEmail) throw new Error('Informe o seu e-mail.');
if (!password) throw new Error('Informe a sua palavra-passe.');

const { data, error } = await supabaseClient.auth.signInWithPassword({
email: cleanEmail,
password
});

if (error) {
throw new Error('E-mail ou palavra-passe incorretos.');
}

return { user: data.user, session: data.session };
},

signUp: async (email, password, nomeCafeteria) => {
const cleanEmail = email.trim().toLowerCase();
if (!cleanEmail || !password) throw new Error('Preencha o e-mail e a palavra-passe.');

const cafeteriaExistente = await supabaseService.buscarCafeteriaPorEmail(cleanEmail);
if (cafeteriaExistente) {
throw new Error('Este e-mail já possui uma conta no CoffeeFlow. Faça login ou recupere a palavra-passe.');
}

const { data, error } = await supabaseClient.auth.signUp({
email: cleanEmail,
password
});

if (error) throw new Error(error.message || 'Erro ao criar conta.');

const userId = data?.user?.id || null;
if (!userId) throw new Error('A conta foi criada, mas o ID do usuário não foi retornado.');

const pinUnico = gerarPinAleatorio();
const cafeteriaSalva = await supabaseService.criarCafeteria(userId, cleanEmail, nomeCafeteria, pinUnico);

return { user: data.user, session: data.session, cafeteria: cafeteriaSalva };
},

recuperarSenha: async (email) => {
const cleanEmail = email.trim().toLowerCase();
if (!cleanEmail) throw new Error('Informe o e-mail da sua conta.');

const redirectUrl = ``${window.location.origin}${window.location.pathname}?reset=true;
const { error } = await supabaseClient.auth.resetPasswordForEmail(cleanEmail, {
redirectTo: redirectUrl
});

if (error) {
throw new Error('Não foi possível enviar o e-mail de recuperação.');
}
return true;
}
};

const planoEstaValido = (caf) => {
if (!caf) return false;
if (caf.isVitalicio) return true;
if (!caf.planoAtivo) return false;
if (!caf.dataExpiracao) return false;
return new Date(caf.dataExpiracao) > new Date();
};

const calcularDiasRestantes = (dataExpiracao, isVitalicio = false) => {
if (isVitalicio) return 9999;
if (!dataExpiracao) return 0;
const diferenca = new Date(dataExpiracao).getTime() - Date.now();
if (diferenca <= 0) return 0;
return Math.ceil(diferenca / (1000 * 60 * 60 * 24));
};

useEffect(() => {
if (isClientAccessFromQr || isResetPassword) return;

const processarSessaoAtiva = async (session) => {
if (session?.user?.id) {
currentAccessToken = session.access_token || null;
const dadosCaf = await supabaseService.buscarCafeteriaPorUserId(session.user.id);
if (dadosCaf) {
const eVitalicio = dadosCaf.data_expiracao && new Date(dadosCaf.data_expiracao).getFullYear() > 2090;
setCafeteria({
id: dadosCaf.id,
nome: dadosCaf.nome,
pinEquipe: dadosCaf.pin_equipe,
planoAtivo: dadosCaf.plano_ativo === true,
donoEmail: dadosCaf.email || dadosCaf.dono_email,
dataInscricao: dadosCaf.data_inscricao || new Date().toISOString(),
dataExpiracao: dadosCaf.data_expiracao || null,
isVitalicio: eVitalicio
});
setIsLoggedInAdmin(true);
setActiveView(prev => prev === 'landing' || prev === 'admin_login' ? 'admin' : prev);
}
}
};

supabaseClient.auth.getSession().then(({ data: { session } }) => {
if (session) processarSessaoAtiva(session);
});

const { data: { subscription } } =
supabaseClient.auth.onAuthStateChange((event, session) => {

currentAccessToken = session?.access_token || null;

if (session) {
processarSessaoAtiva(session);
} else if (event === 'SIGNED_OUT') {
currentAccessToken = null;
setIsLoggedInAdmin(false);
}
});

return () => subscription?.unsubscribe();
}, []);

const handleAdminAuth = async (e) => {
e.preventDefault();
setAdminAuthError('');
setAdminAuthSuccess('');
setLoadingAuth(true);

try {
if (adminAuthMode === 'forgot') {
if (!adminEmailInput) throw new Error('Introduza o e-mail associado à sua conta.');
await authService.recuperarSenha(adminEmailInput);
setAdminAuthSuccess('E-mail de redefinição enviado com sucesso!');
} else if (adminAuthMode === 'login') {
const { user, session } = await authService.login(
adminEmailInput,
adminPasswordInput
);

if (!session?.access_token) {
throw new Error(
'O login foi realizado, mas o Supabase não forneceu uma sessão válida.'
);
}

currentAccessToken = session.access_token;

const dadosCaf = await supabaseService.buscarCafeteriaPorUserId(user.id);
let cafeteriaFinal = dadosCaf;

if (!cafeteriaFinal) {
try {
const novoPin = gerarPinAleatorio();
cafeteriaFinal = await supabaseService.criarCafeteria(user.id, user.email || adminEmailInput, 'CoffeeFlow', novoPin);
} catch (error) {
await supabaseClient.auth.signOut();
throw new Error('Conta existe, mas não foi possível criar a cafeteria.');
}
}

const eVitalicio = cafeteriaFinal.data_expiracao && new Date(cafeteriaFinal.data_expiracao).getFullYear() > 2090;
setIsLoggedInAdmin(true);
setCafeteria({
id: cafeteriaFinal.id,
nome: cafeteriaFinal.nome,
pinEquipe: cafeteriaFinal.pin_equipe,
planoAtivo: cafeteriaFinal.plano_ativo === true,
donoEmail: cafeteriaFinal.email || cafeteriaFinal.dono_email || adminEmailInput,
dataInscricao: cafeteriaFinal.data_inscricao || new Date().toISOString(),
dataExpiracao: cafeteriaFinal.data_expiracao || null,
isVitalicio: eVitalicio
});
setActiveView('admin');
} else {
const { cafeteria: novaCaf, session } = await authService.signUp(adminEmailInput, adminPasswordInput, nomeCafeteriaInput || 'CoffeeFlow');
if (session?.access_token) {
currentAccessToken = session.access_token;
}
setIsLoggedInAdmin(true);
setCafeteria({
id: novaCaf.id,
nome: novaCaf.nome,
pinEquipe: novaCaf.pin_equipe,
planoAtivo: true,
donoEmail: adminEmailInput,

dataExpiracao: novaCaf.data_expiracao || null,
isVitalicio: false
});
setActiveView('admin');
}
} catch (err) {
setAdminAuthError(err.message || 'Erro na autenticação.');
} finally {
setLoadingAuth(false);
}
};
