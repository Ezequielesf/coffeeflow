<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoffeeFlow - Painel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React e ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [pin, setPin] = useState('');
      const [pinError, setPinError] = useState('');
      const [loading, setLoading] = useState(false);
      const [cafeteria, setCafeteria] = useState(null);

      // Função buscarCafeteriaPorPin atualizada
      const buscarCafeteriaPorPin = async (inputPin) => {
        const res = await fetch('/api/staff-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: inputPin })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          console.error('Erro no staff-login:', res.status, data);
          throw new Error(data?.error || `Erro HTTP ${res.status}`);
        }

        return data.cafeteria;
      };

      // Função handleLoginStaff atualizada
      const handleLoginStaff = async (e) => {
        e.preventDefault();
        setPinError('');
        setLoading(true);

        try {
          if (!pin || pin.trim() === '') {
            throw new Error('Por favor, digite o PIN.');
          }

          const dadosCafeteria = await buscarCafeteriaPorPin(pin.trim());
          setCafeteria(dadosCafeteria);
        } catch (err) {
          console.error('Erro no acesso da equipe:', err);
          setPinError(err.message || 'Não foi possível validar o PIN.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4">
          <div className="max-w-md w-full bg-white rounded-xl shadow-md p-6">
            <h1 className="text-2xl font-bold mb-6 text-center text-slate-900">CoffeeFlow - Acesso Equipe</h1>
            
            {!cafeteria ? (
              <form onSubmit={handleLoginStaff} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-1">PIN da Equipe</label>
                  <input
                    type="password"
                    value={pin}
                    onChange={(e) => setPin(e.target.value)}
                    placeholder="Digite o PIN"
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>

                {pinError && (
                  <p className="text-sm text-red-600">{pinError}</p>
                )}

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2 px-4 rounded-lg transition-colors disabled:opacity-50"
                >
                  {loading ? 'Validando...' : 'Entrar'}
                </button>
              </form>
            ) : (
              <div className="text-center space-y-4">
                <h2 className="text-xl font-semibold text-slate-800">Bem-vindo, {cafeteria.nome}!</h2>
                <p className="text-sm text-slate-600">Acesso autorizado com sucesso.</p>
                <button
                  onClick={() => { setCafeteria(null); setPin(''); }}
                  className="text-sm text-amber-600 hover:underline"
                >
                  Sair / Trocar PIN
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
