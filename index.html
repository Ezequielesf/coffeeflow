<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeFlow - Painel Operacional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // Inicialização do cliente Supabase (ajuste com suas chaves se necessário)
        const supabaseUrl = 'SUA_SUPABASE_URL';
        const supabaseKey = 'SUA_SUPABASE_ANON_KEY';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // ==========================================
        // 1. SUPABASE SERVICE (MÉTODOS DE PRODUTOS)
        // ==========================================
        const supabaseService = {
          salvarProduto: async (produto) => {
            try {
              const {
                data: { session },
                error: sessionError
              } = await supabaseClient.auth.getSession();

              if (sessionError) {
                throw sessionError;
              }

              if (!session?.access_token) {
                throw new Error('Sua sessão expirou. Faça login novamente.');
              }

              if (!produto?.nome || !produto.nome.trim()) {
                throw new Error('Informe o nome do produto.');
              }

              if (!Number.isFinite(Number(produto.preco))) {
                throw new Error('Informe um preço válido.');
              }

              const isEdit = Boolean(
                produto.id &&
                !String(produto.id).startsWith('p_')
              );

              const response = await fetch('/api/products', {
                method: isEdit ? 'PATCH' : 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${session.access_token}`
                },
                body: JSON.stringify({
                  ...(isEdit ? { id: produto.id } : {}),
                  nome: produto.nome.trim(),
                  preco: Number(produto.preco),
                  categoria: produto.categoria?.trim() || 'Cafés',
                  descricao: produto.descricao?.trim() || '',
                  imagem: produto.imagem?.trim() || '',
                  disponivel: produto.disponivel !== false
                })
              });

              const result = await response.json().catch(() => ({}));

              if (!response.ok) {
                throw new Error(
                  result.error ||
                  'Não foi possível salvar o produto.'
                );
              }

              return {
                success: true,
                produto: result.produto || null
              };

            } catch (err) {
              console.error('Erro em salvarProduto:', err);
              return {
                success: false,
                error: err.message || 'Erro desconhecido ao salvar o produto.'
              };
            }
          },

          deletarProduto: async (id) => {
            try {
              const {
                data: { session },
                error: sessionError
              } = await supabaseClient.auth.getSession();

              if (sessionError) {
                throw sessionError;
              }

              if (!session?.access_token) {
                throw new Error('Sua sessão expirou. Faça login novamente.');
              }

              if (!id) {
                throw new Error('ID do produto não informado.');
              }

              const response = await fetch('/api/products', {
                method: 'DELETE',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ id })
              });

              const result = await response.json().catch(() => ({}));

              if (!response.ok) {
                throw new Error(
                  result.error ||
                  'Não foi possível excluir o produto.'
                );
              }

              return {
                success: true,
                produto: result.produto || null
              };

            } catch (err) {
              console.error('Erro em deletarProduto:', err);
              return {
                success: false,
                error: err.message || 'Não foi possível excluir o produto.'
              };
            }
          }
        };

        // ==========================================
        // 2. COMPONENTE PRINCIPAL (COFFEEFLOW APP)
        // ==========================================
        function App() {
          const [cafeteria, setCafeteria] = React.useState({ id: '1', nome: 'Cafeteria Exemplo' });
          const [produtos, setProdutos] = React.useState([]);
          const [notificacao, setNotificacao] = React.useState('');
          const [modalProduto, setModalProduto] = React.useState({ open: false, data: null });

          const carregarDadosDoBanco = async () => {
            // Simulação de carregamento ou chamada real ao banco
            console.log("Dados atualizados com sucesso.");
          };

          const handleSalvarProduto = async (e) => {
            e.preventDefault();

            try {
              const formData = new FormData(e.target);
              const preco = parseFloat(formData.get('preco'));

              const prodData = {
                id: modalProduto.data?.id,
                cafeteria_id: cafeteria.id,
                nome: (formData.get('nome') || '').toString().trim(),
                preco,
                categoria: (formData.get('categoria') || 'Cafés').toString().trim(),
                descricao: (formData.get('descricao') || '').toString().trim(),
                imagem: (formData.get('imagem') || '').toString().trim(),
                disponivel: modalProduto.data ? modalProduto.data.disponivel : true
              };

              const resultado = await supabaseService.salvarProduto(prodData);

              if (!resultado?.success) {
                throw new Error(resultado?.error || 'Não foi possível salvar o produto.');
              }

              await carregarDadosDoBanco();

              setModalProduto({ open: false, data: null });
              setNotificacao(
                modalProduto.data
                  ? 'Produto atualizado com sucesso!'
                  : 'Produto adicionado com sucesso!'
              );

              setTimeout(() => setNotificacao(''), 4000);

            } catch (err) {
              console.error('Erro ao guardar produto:', err);
              setNotificacao(err.message || 'Não foi possível guardar o produto.');
              setTimeout(() => setNotificacao(''), 6000);
            }
          };

          const handleRemoverProduto = async (id) => {
            if (!id) {
              setNotificacao('Produto inválido.');
              setTimeout(() => setNotificacao(''), 4000);
              return;
            }

            if (!confirm('Deseja eliminar este item da ementa?')) {
              return;
            }

            try {
              const resultado = await supabaseService.deletarProduto(id);

              if (!resultado?.success) {
                throw new Error(resultado?.error || 'Não foi possível eliminar o produto.');
              }

              await carregarDadosDoBanco();
              setNotificacao('Produto eliminado com sucesso!');
              setTimeout(() => setNotificacao(''), 4000);

            } catch (err) {
              console.error('Erro ao eliminar produto:', err);
              setNotificacao(err.message || 'Não foi possível eliminar o produto.');
              setTimeout(() => setNotificacao(''), 6000);
            }
          };

          return (
            <div className="min-h-screen p-6 max-w-6xl mx-auto">
              <header className="flex justify-between items-center mb-8 pb-4 border-b border-zinc-800">
                <h1 className="text-2xl font-bold tracking-tight text-amber-500">CoffeeFlow Painel</h1>
                {notificacao && (
                  <div className="bg-amber-500/10 border border-amber-500/20 text-amber-300 px-4 py-2 rounded text-sm">
                    {notificacao}
                  </div>
                )}
              </header>

              <main>
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-semibold">Ementa Ativa</h2>
                  <button
                    onClick={() => setModalProduto({ open: true, data: null })}
                    className="bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold px-4 py-2 rounded transition"
                  >
                    Novo Produto
                  </button>
                </div>

                {/* Exemplo de listagem com os botões de Ação (Editar / Eliminar) */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {/* Exemplo mockado de card de produto */}
                  <div className="bg-zinc-900 border border-zinc-800 p-4 rounded-lg flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-lg">Café Expresso</h3>
                      <p className="text-zinc-400 text-sm mt-1">Café curto encorpado.</p>
                      <span className="inline-block mt-2 font-mono text-amber-400 font-bold">€ 1.50</span>
                    </div>

                    <div className="flex gap-2 mt-4 pt-4 border-t border-zinc-800">
                      <button
                        onClick={() =>
                          setModalProduto({
                            open: true,
                            data: { id: 'p_1', nome: 'Café Expresso', preco: 1.50, categoria: 'Cafés', descricao: 'Café curto encorpado.' }
                          })
                        }
                        className="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded text-[10px] font-bold hover:bg-amber-500/30"
                      >
                        Editar
                      </button>

                      <button
                        onClick={() => handleRemoverProduto('p_1')}
                        className="px-2 py-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded text-[10px] font-bold hover:bg-rose-500/30"
                      >
                        Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </main>

              {/* Modal de Cadastro/Edição de Produto */}
              {modalProduto.open && (
                <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4">
                  <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-lg max-w-md w-full">
                    <h3 className="text-lg font-bold mb-4">
                      {modalProduto.data ? 'Editar Item da Ementa' : 'Novo Item na Ementa'}
                    </h3>
                    <form onSubmit={handleSalvarProduto} className="space-y-4">
                      <div>
                        <label className="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Nome</label>
                        <input
                          type="text"
                          name="nome"
                          defaultValue={modalProduto.data?.nome || ''}
                          required
                          className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Preço (€)</label>
                        <input
                          type="number"
                          step="0.01"
                          name="preco"
                          defaultValue={modalProduto.data?.preco || ''}
                          required
                          className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Descrição</label>
                        <textarea
                          name="descricao"
                          defaultValue={modalProduto.data?.descricao || ''}
                          className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500"
                        ></textarea>
                      </div>
                      <div className="flex justify-end gap-2 mt-6">
                        <button
                          type="button"
                          onClick={() => setModalProduto({ open: false, data: null })}
                          className="px-4 py-2 bg-zinc-800 text-zinc-300 rounded text-sm hover:bg-zinc-700"
                        >
                          Cancelar
                        </button>
                        <button
                          type="submit"
                          className="px-4 py-2 bg-amber-600 text-zinc-950 font-bold rounded text-sm hover:bg-amber-500"
                        >
                          Guardar
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
